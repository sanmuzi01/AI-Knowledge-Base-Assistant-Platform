name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: agent_sql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: agent_sql
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-in-production
      JWT_ALGORITHM: HS256
      LLM_ENCRYPTION_KEY: LG5sThiGcVsg9jRbbN_fezONjfKdo3E72yQPYIUwZHQ=
      REDIS_URL: ""
      SMS_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent; then
              echo "MySQL is up"; break
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done

      - name: Byte-compile sources
        run: python -m compileall -q FasdtApi service models utils scripts tests

      - name: Bootstrap database (schema + idempotent migration smoke test)
        run: |
          python -c "from models.init_db import bootstrap_database; bootstrap_database(force=True)"
          # 再跑一次（新进程），验证幂等：不应报错、不应重复建列/索引
          python -c "from models.init_db import bootstrap_database; bootstrap_database(force=True)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
