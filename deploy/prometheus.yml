# 非容器部署：假设 Prometheus 与 API 同机。rule_files 路径按你的 Prometheus
# 工作目录调整（可直接指向本仓库的 deploy/prometheus-rules.yml）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - prometheus-rules.yml

scrape_configs:
  - job_name: agent-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8000
