services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      VECTOR_DB_PATH: /app/vector_db
      KNOWLEDGE_FILE_PATH: /app/knowledge_files
      TASK_EXECUTION_MODE: worker
    command: ["uvicorn", "FasdtApi.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-2}"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./knowledge_files:/app/knowledge_files
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
      - ./skills:/app/skills
      - ./skills_packages:/app/skills_packages
      - ./prompt/prompts:/app/prompt/prompts
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      VECTOR_DB_PATH: /app/vector_db
      KNOWLEDGE_FILE_PATH: /app/knowledge_files
      TASK_EXECUTION_MODE: worker
    command: ["python", "-m", "service.background_worker"]
    volumes:
      - ./knowledge_files:/app/knowledge_files
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
      - ./skills:/app/skills
      - ./skills_packages:/app/skills_packages
      - ./prompt/prompts:/app/prompt/prompts
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
